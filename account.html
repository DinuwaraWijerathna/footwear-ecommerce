<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — STEPZ | Premium Footwear</title>
  <meta name="description" content="Manage your STEPZ profile, orders, and addresses.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ═══════════════════════════════ NAVBAR ═══════════════════════════════ -->
<nav class="navbar" id="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">STEP<span>Z</span></a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="offers.html">Offers</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="wishlist.html">Wishlist</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <a href="account.html" class="nav-icon-btn" id="userBtn" title="Account">
        <i class="fa-solid fa-user-check" style="color:var(--accent)"></i>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- ═══════════════════════════════ HEADER BANNER ═══════════════════════════════ -->
<section style="padding:120px 0 40px;background:var(--bg-secondary);border-bottom:1px solid var(--border-glass)">
  <div class="container">
    <h1 style="font-size:2.2rem;font-weight:900;margin-bottom:8px">Customer Portal</h1>
    <p style="color:var(--text-secondary)">Manage your account, track orders, and update preferences</p>
  </div>
</section>

<!-- ═══════════════════════════════ ACCOUNT LAYOUT ═══════════════════════════════ -->
<section class="account-section">
  <div class="container">

    <div class="account-layout">

      <!-- Sidebar Card -->
      <div class="account-sidebar-card">
        <div class="account-user-header">
          <div class="account-user-avatar" id="accAvatar">K</div>
          <h3 id="accName" style="font-size:1.1rem;color:var(--text-primary);margin-bottom:4px">Kamal Perera</h3>
          <p id="accEmail" style="font-size:0.8rem;color:var(--text-muted)">kamal@gmail.com</p>
        </div>

        <button class="account-nav-btn active" id="btnTabOrders" onclick="switchAccountTab('orders')">
          <i class="fa-solid fa-box-open"></i> My Orders
        </button>
        <button class="account-nav-btn" id="btnTabProfile" onclick="switchAccountTab('profile')">
          <i class="fa-solid fa-user-gear"></i> Personal Profile
        </button>
        <button class="account-nav-btn" id="btnTabAddresses" onclick="switchAccountTab('addresses')">
          <i class="fa-solid fa-location-dot"></i> Saved Addresses
        </button>
        <button class="account-nav-btn" onclick="logoutCustomer()" style="color:var(--accent2);margin-top:20px">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>

      <!-- Main Content Tab -->
      <div class="account-tab-content" id="accountTabBody">
        <!-- Rendered by app.js -->
      </div>

    </div>

  </div>
</section>

<!-- ═══════════════════════════════ TOAST ═══════════════════════════════ -->
<div class="toast" id="toast">
  <span class="toast-icon">✅</span>
  <span id="toastMsg">Added to cart!</span>
</div>

<script src="app.js"></script>
</body>
</html>
