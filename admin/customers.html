<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — STEPZ Admin</title>
  <meta name="description" content="View and manage STEPZ customers.">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="admin-layout">

  <!-- ═══════════════════════════════ SIDEBAR ═══════════════════════════════ -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo">
      <span class="logo-text">STEP<span>Z</span></span>
      <span class="admin-tag">Admin</span>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Main</div>
        <a href="index.html" class="sidebar-link">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Dashboard</span>
        </a>
        <a href="products.html" class="sidebar-link">
          <i class="fa-solid fa-shoe-prints"></i>
          <span>Products</span>
        </a>
        <a href="orders.html" class="sidebar-link">
          <i class="fa-solid fa-receipt"></i>
          <span>Orders</span>
        </a>
        <a href="customers.html" class="sidebar-link active">
          <i class="fa-solid fa-users"></i>
          <span>Customers</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          <i class="fa-solid fa-star"></i>
          <span>Reviews</span>
        </a>
        <a href="offers.html" class="sidebar-link">
          <i class="fa-solid fa-tag"></i>
          <span>Offers & Coupons</span>
        </a>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">System</div>
        <a href="settings.html" class="sidebar-link">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
        <a href="../index.html" class="sidebar-link">
          <i class="fa-solid fa-store"></i>
          <span>Visit Store</span>
        </a>
        <a href="#" class="sidebar-link" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
        <button class="sidebar-logout" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ═══════════════════════════════ MAIN CONTENT ═══════════════════════════════ -->
  <main class="admin-main">

    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-title">
          <h1>Customers</h1>
          <p>View and manage your customer base</p>
        </div>
      </div>
      <div class="topbar-right">
        <a href="../index.html" class="visit-site-btn">
          <i class="fa-solid fa-external-link"></i>
          <span>Visit Store</span>
        </a>
      </div>
    </header>

    <div class="admin-content">

      <!-- Toolbar -->
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <div class="table-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search customers..." id="customerSearch">
          </div>
        </div>
      </div>

      <!-- Customers Table -->
      <div class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Phone</th>
                <th>Joined</th>
                <th>Orders</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customersTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ═══════════════════════════════ CUSTOMER DETAILS MODAL ═══════════════════════════════ -->
<div class="admin-modal-overlay" id="customerModalOverlay">
  <div class="admin-modal" style="max-width:650px">
    <div class="modal-header">
      <h2>Customer Details</h2>
      <button class="modal-close" id="customerModalClose">✕</button>
    </div>
    <div class="modal-body" id="customerModalBody">
      <!-- Dynamic Customer Profile Content rendered by JS -->
    </div>
    <div class="modal-footer">
      <button type="button" class="modal-btn-cancel" id="customerModalCloseBtn">Close</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
