<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Coupons — STEPZ Admin</title>
  <meta name="description" content="Manage store promotional offers and discount coupons.">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo">
      <span class="logo-text">STEP<span>Z</span></span>
      <span class="admin-tag">Admin</span>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Main</div>
        <a href="index.html" class="sidebar-link">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Dashboard</span>
        </a>
        <a href="products.html" class="sidebar-link">
          <i class="fa-solid fa-shoe-prints"></i>
          <span>Products</span>
        </a>
        <a href="orders.html" class="sidebar-link">
          <i class="fa-solid fa-receipt"></i>
          <span>Orders</span>
        </a>
        <a href="customers.html" class="sidebar-link">
          <i class="fa-solid fa-users"></i>
          <span>Customers</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          <i class="fa-solid fa-star"></i>
          <span>Reviews</span>
        </a>
        <a href="offers.html" class="sidebar-link active">
          <i class="fa-solid fa-tag"></i>
          <span>Offers & Coupons</span>
        </a>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">System</div>
        <a href="settings.html" class="sidebar-link">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
        <a href="../index.html" class="sidebar-link">
          <i class="fa-solid fa-store"></i>
          <span>Visit Store</span>
        </a>
        <a href="#" class="sidebar-link" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
        <button class="sidebar-logout" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="admin-main">

    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-title">
          <h1>Offers & Coupons</h1>
          <p>Create and manage discount codes for customers</p>
        </div>
      </div>
      <div class="topbar-right">
        <a href="../index.html" class="visit-site-btn">
          <i class="fa-solid fa-external-link"></i>
          <span>Visit Store</span>
        </a>
      </div>
    </header>

    <div class="admin-content">

      <!-- Toolbar -->
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <div class="table-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search coupon code..." id="offerSearch">
          </div>
        </div>
        <button class="add-btn" id="addOfferBtn">
          <i class="fa-solid fa-plus"></i> Create Promo Code
        </button>
      </div>

      <!-- Offers Table -->
      <div class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Discount</th>
                <th>Min Spend</th>
                <th>Expiry Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="offersTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="admin-modal-overlay" id="offerModalOverlay">
  <div class="admin-modal">
    <div class="modal-header">
      <h2 id="offerModalTitle">Create Promo Code</h2>
      <button class="modal-close" id="offerModalClose">✕</button>
    </div>
    <div class="modal-body">
      <form class="modal-form" id="offerForm">
        <div class="form-row">
          <div class="form-group">
            <label for="oCode">Promo Code</label>
            <input type="text" id="oCode" placeholder="e.g. STEPZ15" required style="text-transform:uppercase">
          </div>
          <div class="form-group">
            <label for="oType">Discount Type</label>
            <select id="oType" required>
              <option value="percentage">Percentage (%)</option>
              <option value="fixed">Fixed Amount (Rs.)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="oValue">Discount Value</label>
            <input type="number" id="oValue" placeholder="15" required min="1">
          </div>
          <div class="form-group">
            <label for="oMinSpend">Min Order Spend (Rs.)</label>
            <input type="number" id="oMinSpend" placeholder="5000" required>
          </div>
        </div>

        <div class="form-group">
          <label for="oExpiry">Expiry Date</label>
          <input type="date" id="oExpiry" required>
        </div>

        <div class="form-group" style="flex-direction:row;align-items:center;gap:12px">
          <label for="oActive" style="margin:0">Active Status</label>
          <label class="toggle-switch">
            <input type="checkbox" id="oActive" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="modal-btn-cancel" id="offerCancelBtn">Cancel</button>
      <button type="submit" class="modal-btn-save" form="offerForm">Save Promo Code</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
